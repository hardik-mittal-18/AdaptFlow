global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "adaptflow-ml-service"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["ml-service:8000", "host.docker.internal:8000"]
        labels:
          app: "adaptflow-ml"
          environment: "production"

  - job_name: "adaptflow-gateway"
    metrics_path: "/api/monitoring/status"
    params:
      format: ["prometheus"]
    scrape_interval: 15s
    static_configs:
      - targets: ["gateway:3000", "host.docker.internal:3000"]
        labels:
          app: "adaptflow-gateway"
          environment: "production"
